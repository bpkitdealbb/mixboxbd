name: Build & Deploy to Firebase
on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ==========================================
      # নতুন যোগ করা হয়েছে: প্রোডাক্ট আপডেট হলে Sitemap অটো আপডেট হবে
      # ==========================================
      - name: Generate Sitemap
        run: |
          echo "🔄 Fetching latest sitemap from Google Apps Script..."
          
          # ৩০ সেকেন্ডের টাইমআউট দেওয়া হয়েছে (Google Apps Script কিছুটা স্লো হতে পারতে পারে)
          curl -s --max-time 30 "https://script.google.com/macros/s/AKfycbzVVnqM8BRootcSD5xsDrcsFOSMTfWb3KAzlIWHfEXNFdE-NYOzCX8EbyGUGslbQyVs/exec?page=sitemap" -o public/sitemap.xml
          
          # চেক করা হচ্ছে ফাইল ঠিক মতো এসেছে কিনা
          if [ -f "public/sitemap.xml" ]; then
            echo "✅ Sitemap downloaded successfully!"
            echo "📊 Total URLs found: $(grep -c '<loc>' public/sitemap.xml)"
          else
            echo "⚠️ Failed to download sitemap. Deploying without sitemap update..."
          fi

      # ==========================================
      # Firebase-এ ডিপ্লয় করা হচ্ছে
      # ==========================================
      - name: Deploy to Firebase
        uses: FirebaseActions/action@v0
        with:
          projectId: safaboxbd
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project safaboxbd
