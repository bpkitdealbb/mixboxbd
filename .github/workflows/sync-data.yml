name: Sync E-commerce Data

on:
  # ==========================================
  # ১. GAS থেকে Automatic Trigger
  # ==========================================
  repository_dispatch:
    types:
      - data-update

  # ==========================================
  # ২. GitHub Actions থেকে Manual Trigger
  # ==========================================
  workflow_dispatch:
    inputs:
      source:
        description: 'Trigger source'
        required: false
        default: 'manual'
        type: string

      version:
        description: 'Data version'
        required: false
        default: ''
        type: string


# ==========================================
# GitHub Repository Permission
# deployments: write টা Cloudflare Pages deploy জবের জন্য যোগ করা হয়েছে
# ==========================================
permissions:
  contents: write
  deployments: write


# ==========================================
# একই সময়ে একাধিক Sync চলা আটকানো
#
# cancel-in-progress: false
# → আগের Sync চললে সেটি বাতিল হবে না।
# → নতুন Sync অপেক্ষা করবে।
# ==========================================
concurrency:
  group: sync-ecommerce-data
  cancel-in-progress: false


jobs:

  # ==========================================
  # জব ১: GAS থেকে ডেটা সিঙ্ক (fetch + validate + commit + push)
  # এটা Firebase বা Cloudflare — কোনোটাই ডিপ্লয় করে না,
  # শুধু data.json আপডেট করে GitHub-এ পুশ করে
  # ==========================================
  sync-data:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Repository Checkout
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # Trigger Information বের করা
      # Automatic + Manual উভয়ের জন্য
      # ==========================================
      - name: Set Trigger Information
        shell: bash
        run: |

          # --------------------------------------
          # Automatic repository_dispatch
          # --------------------------------------
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then

            SOURCE="${{ github.event.client_payload.source }}"
            VERSION="${{ github.event.client_payload.version }}"

            # source ফাঁকা হলে
            if [ -z "$SOURCE" ]; then
              SOURCE="repository_dispatch"
            fi

            echo "🔔 Trigger Type: Automatic"
            echo "📌 Source: $SOURCE"
            echo "📦 Version: $VERSION"

          # --------------------------------------
          # Manual workflow_dispatch
          # --------------------------------------
          else

            SOURCE="${{ github.event.inputs.source }}"
            VERSION="${{ github.event.inputs.version }}"

            # source ফাঁকা হলে
            if [ -z "$SOURCE" ]; then
              SOURCE="manual"
            fi

            echo "🔔 Trigger Type: Manual"
            echo "📌 Source: $SOURCE"
            echo "📦 Version: $VERSION"

          fi

          # GitHub Environment Variables-এ রাখা
          echo "SYNC_SOURCE=$SOURCE" >> "$GITHUB_ENV"
          echo "SYNC_VERSION=$VERSION" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "Trigger Information"
          echo "=========================================="
          echo "Type: ${{ github.event_name }}"
          echo "Source: $SOURCE"
          echo "Version: $VERSION"
          echo "=========================================="


      # ==========================================
      # GAS থেকে Data Fetch + Validation
      # ==========================================
      - name: Fetch and Validate Data from GAS
        shell: bash
        run: |

          set -u

          MAX_RETRIES=5
          RETRY_DELAY=5

          SUCCESS=false

          echo ""
          echo "=========================================="
          echo "Starting GAS Data Synchronization"
          echo "=========================================="
          echo "Trigger Source: $SYNC_SOURCE"
          echo "Requested Version: $SYNC_VERSION"
          echo "=========================================="


          # ======================================
          # Retry Loop
          # ======================================
          for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do

            echo ""
            echo "🔄 Attempt $attempt/$MAX_RETRIES"

            # পুরনো temporary file মুছে ফেলা
            rm -f data.json.tmp


            # ==================================
            # GAS থেকে Data Fetch
            # ==================================
            HTTP_CODE=$(curl -sL \
              --connect-timeout 15 \
              --max-time 60 \
              -w "%{http_code}" \
              "${{ secrets.GAS_URL }}?action=getInitialData&t=$(date +%s)" \
              -o data.json.tmp)


            echo "🌐 GAS HTTP Status: $HTTP_CODE"


            # ==================================
            # HTTP Status Validation
            # ==================================
            if [ "$HTTP_CODE" != "200" ]; then

              echo "❌ HTTP error received: $HTTP_CODE"
              rm -f data.json.tmp


            # ==================================
            # Empty File Validation
            # ==================================
            elif [ ! -s data.json.tmp ]; then

              echo "❌ GAS returned an empty response"
              rm -f data.json.tmp


            # ==================================
            # JSON Validation
            # ==================================
            elif ! jq empty data.json.tmp >/dev/null 2>&1; then

              echo "❌ GAS returned invalid JSON"
              rm -f data.json.tmp


            # ==================================
            # success:false Validation
            # ==================================
            elif jq -e '.success == false' data.json.tmp >/dev/null 2>&1; then

              echo "❌ GAS returned success:false"

              ERROR_MESSAGE=$(jq -r \
                '.error // "Unknown GAS error"' \
                data.json.tmp 2>/dev/null || true)

              echo "GAS Error: $ERROR_MESSAGE"

              rm -f data.json.tmp


            # ==================================
            # Required Data Validation
            # ==================================
            elif ! jq -e '
              (
                .data? // .
              ) as $d
              |
              (
                ($d.products != null)
                or
                ($d.settings != null)
              )
            ' data.json.tmp >/dev/null 2>&1; then

              echo "❌ Required application data not found"
              echo "❌ products/settings missing"

              rm -f data.json.tmp


            # ==================================
            # সব Validation সফল
            # ==================================
            else

              echo "✅ GAS data passed validation"

              # Temporary file থেকে আসল data.json replace
              mv data.json.tmp data.json

              echo "✅ data.json updated successfully"

              SUCCESS=true

              break

            fi


            # ==================================
            # Retry
            # ==================================
            if [ "$attempt" -lt "$MAX_RETRIES" ]; then

              echo ""
              echo "⏳ Correct data not received."
              echo "⏳ Retrying after ${RETRY_DELAY} seconds..."

              sleep "$RETRY_DELAY"

              # Exponential Backoff
              RETRY_DELAY=$((RETRY_DELAY * 2))

            fi

          done


          # ==========================================
          # সব Retry ব্যর্থ হলে
          # ==========================================
          if [ "$SUCCESS" != "true" ]; then

            echo ""
            echo "=========================================="
            echo "❌ GAS Data Synchronization Failed"
            echo "=========================================="

            echo "❌ $MAX_RETRIES attempts failed."
            echo "ℹ️ Existing data.json was NOT replaced."
            echo "ℹ️ GitHub will NOT be updated."
            echo "ℹ️ Firebase/Cloudflare deployment will NOT happen."

            rm -f data.json.tmp

            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "✅ Valid GAS Data Successfully Received"
          echo "=========================================="


      # ==========================================
      # data.json থেকে sitemap.xml তৈরি
      # ব্যর্থ হলেও data.json সিঙ্ক আটকাবে না
      # ==========================================
      - name: Generate sitemap from data.json
        continue-on-error: true
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const raw = JSON.parse(fs.readFileSync('data.json', 'utf8'));
          const d = raw.data || raw;
          const products = Array.isArray(d.products) ? d.products : [];
          const categories = Array.isArray(d.categories) ? d.categories : [];

          if (products.length === 0) {
            console.log('No products found, keeping existing sitemap.xml');
            process.exit(0);
          }

          const baseUrl = 'https://safaboxbd.web.app';
          const today = new Date().toISOString().split('T')[0];

          function slugifyText(input) {
            if (input === undefined || input === null) return '';
            return String(input).toLowerCase().trim()
              .replace(/\s*>\s*/g, '-')
              .replace(/[^\p{L}\p{M}\p{N}]+/gu, '-')
              .replace(/^-+|-+$/g, '');
          }

          function esc(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;')
              .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
          }

          const istop = c => String(c.istop || '').trim().toLowerCase();
          const added = new Set();
          const entries = [];

          function add(loc, pri, freq) {
            if (!loc || added.has(loc)) return;
            added.add(loc);
            entries.push({ loc: loc, pri: pri, freq: freq });
          }

          add(baseUrl + '/', '1.0', 'daily');
          add(baseUrl + '/categories', '0.8', 'weekly');

          const mainNames = [];
          categories.filter(c => istop(c) === 'yes').forEach(c => {
            const name = String(c.categoryname || '').split(' > ')[0].trim();
            if (name && mainNames.indexOf(name) === -1) {
              mainNames.push(name);
              add(baseUrl + '/category/' + encodeURIComponent(slugifyText(name)), '0.9', 'weekly');
            }
          });

          categories.forEach(c => {
            const name = String(c.categoryname || '').trim();
            if (!name || name.indexOf(' > ') === -1) return;
            add(baseUrl + '/category/' + encodeURIComponent(slugifyText(name)), '0.8', 'weekly');
          });

          const brandNames = [];
          categories.filter(c => istop(c) === 'brand').forEach(c => {
            const name = String(c.categoryname || '').split(' > ')[0].trim();
            if (name && brandNames.indexOf(name) === -1) {
              brandNames.push(name);
              add(baseUrl + '/brand/' + encodeURIComponent(slugifyText(name)), '0.8', 'weekly');
            }
          });

          products.forEach(p => {
            if (p.id) add(baseUrl + '/product/' + encodeURIComponent(p.slug || p.id), '0.7', 'weekly');
          });

          let xml = '<?xml version="1.0" encoding="UTF-8"?>\n';
          xml += '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';
          entries.forEach(e => {
            xml += '  <url>\n';
            xml += '    <loc>' + esc(e.loc) + '</loc>\n';
            xml += '    <lastmod>' + today + '</lastmod>\n';
            xml += '    <changefreq>' + e.freq + '</changefreq>\n';
            xml += '    <priority>' + e.pri + '</priority>\n';
            xml += '  </url>\n';
          });
          xml += '</urlset>';

          // শুধু তারিখ বদলালে নতুন কমিট করার দরকার নেই
          const stripDates = x => x.replace(/<lastmod>[^<]*<\/lastmod>/g, '');
          let old = '';
          try { old = fs.readFileSync('sitemap.xml', 'utf8'); } catch (e) {}

          if (stripDates(old) === stripDates(xml)) {
            console.log('Sitemap unchanged');
          } else {
            fs.writeFileSync('sitemap.xml', xml);
            console.log('Sitemap updated: ' + entries.length + ' URLs');
          }
          NODE


      # ==========================================
      # GitHub Commit + Push
      # ==========================================
      - name: Commit and Push
        shell: bash
        run: |

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"


          # data.json Stage
          git add data.json sitemap.xml


          # ======================================
          # Data পরিবর্তন হয়েছে কি না
          # ======================================
          if git diff --cached --quiet; then

            echo ""
            echo "ℹ️ data.json has no changes."
            echo "ℹ️ No GitHub commit required."

            exit 0

          fi


          echo ""
          echo "📦 New data detected."


          # ======================================
          # Version থাকলে Version Commit Message
          # ======================================
          if [ -n "$SYNC_VERSION" ]; then

            COMMIT_MESSAGE="chore: auto-update data.json (v$SYNC_VERSION)"

          else

            COMMIT_MESSAGE="chore: auto-update data.json"

          fi


          echo "📝 Commit: $COMMIT_MESSAGE"


          # ======================================
          # Commit
          # ======================================
          git commit \
            -m "$COMMIT_MESSAGE" \
            -m "Source: $SYNC_SOURCE" \
            -m "Trigger: ${{ github.event_name }}"


          # ======================================
          # Push
          # ======================================
          git push


          echo ""
          echo "=========================================="
          echo "✅ data.json successfully pushed to GitHub"
          echo "=========================================="


  # ==========================================
  # জব ২: Firebase Hosting Deploy
  # ACTIVE_HOST variable-এ 'firebase' বা 'both' থাকলেই চলবে
  # ==========================================
  deploy-firebase:
    needs: sync-data
    if: vars.ACTIVE_HOST == 'firebase' || vars.ACTIVE_HOST == 'both' || vars.ACTIVE_HOST == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (latest main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}


  # ==========================================
  # জব ৩: Cloudflare Pages Deploy
  # ACTIVE_HOST variable-এ 'cloudflare' বা 'both' থাকলেই চলবে
  # ==========================================
  deploy-cloudflare:
    needs: sync-data
    if: vars.ACTIVE_HOST == 'cloudflare' || vars.ACTIVE_HOST == 'both' || vars.ACTIVE_HOST == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Repository (latest main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=safabox
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          
