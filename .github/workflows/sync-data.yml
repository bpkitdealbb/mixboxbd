name: Sync E-commerce Data

on:
  schedule:
    - cron: '0 * * * *' # প্রতি ১ ঘণ্টায় অটো রান হবে
  workflow_dispatch: # ম্যানুয়ালি রান করার বোতাম

# 🔑 গিট পুশ করার পারমিশন দেওয়া হলো
permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # ১. রিপোজিটরি ক্লোন করা
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ২. GAS থেকে ডেটা এনে সরাসরি রুট ফোল্ডারে data.json সেভ করা
      - name: Fetch Data from GAS
        run: |
          curl -sL "${{ secrets.GAS_URL }}" -o data.json
          echo "✅ Data fetched successfully"

      # ৩. গিট-এ কমিট ও পুশ করা
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "chore: auto-update data.json" || exit 0
          git push

      # ৪. ফায়ারবেসে ডিপ্লয় করা
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          
