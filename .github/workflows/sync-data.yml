name: Sync E-commerce Data (Instant)

on:
  repository_dispatch:
    types:
      - data-update

  workflow_dispatch:

permissions:
  contents: write

# একই repository-র একাধিক sync একসাথে চলবে না
# আগের sync বাতিল হবে না
concurrency:
  group: sync-ecommerce-data
  cancel-in-progress: false

jobs:

  sync-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # ১. Repository Checkout
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # ২. GAS থেকে সঠিক data.json আনা
      # ==========================================

      - name: Fetch and Validate Data from GAS
        shell: bash
        run: |

          set -u

          MAX_RETRIES=5
          RETRY_DELAY=5

          SUCCESS=false

          echo "=========================================="
          echo "Starting GAS data synchronization..."
          echo "=========================================="

          echo "Trigger source:"
          echo "${{ github.event.client_payload.source }}"

          echo "Backend version:"
          echo "${{ github.event.client_payload.version }}"

          echo "=========================================="


          # ==========================================
          # Retry Loop
          # ==========================================

          for ((attempt=1; attempt<=MAX_RETRIES; attempt++)); do

            echo ""
            echo "🔄 Attempt $attempt/$MAX_RETRIES"

            rm -f data.json.tmp


            # ==========================================
            # GAS Request
            # ==========================================

            HTTP_CODE=$(curl -sL \
              --connect-timeout 15 \
              --max-time 60 \
              -w "%{http_code}" \
              "${{ secrets.GAS_URL }}?action=getInitialData&t=$(date +%s)" \
              -o data.json.tmp)


            echo "🌐 GAS HTTP Status: $HTTP_CODE"


            # ==========================================
            # HTTP Validation
            # ==========================================

            if [ "$HTTP_CODE" != "200" ]; then

              echo "❌ HTTP error: $HTTP_CODE"

              rm -f data.json.tmp


            # ==========================================
            # Empty Response
            # ==========================================

            elif [ ! -s data.json.tmp ]; then

              echo "❌ GAS returned empty response"

              rm -f data.json.tmp


            # ==========================================
            # JSON Validation
            # ==========================================

            elif ! jq empty data.json.tmp >/dev/null 2>&1; then

              echo "❌ Invalid JSON received from GAS"

              rm -f data.json.tmp


            # ==========================================
            # success:false
            # ==========================================

            elif jq -e '.success == false' data.json.tmp >/dev/null 2>&1; then

              echo "❌ GAS returned success:false"

              ERROR_MESSAGE=$(jq -r \
                '.error // "Unknown GAS error"' \
                data.json.tmp 2>/dev/null || true)

              echo "GAS Error: $ERROR_MESSAGE"

              rm -f data.json.tmp


            # ==========================================
            # Required Application Data
            # ==========================================

            elif ! jq -e '
              (
                .data? // .
              ) as $d
              |
              (
                ($d.products != null)
                or
                ($d.settings != null)
              )
            ' data.json.tmp >/dev/null 2>&1; then

              echo "❌ Required application data not found"

              echo "❌ products/settings missing"

              rm -f data.json.tmp


            # ==========================================
            # SUCCESS
            # ==========================================

            else

              echo "✅ GAS data passed validation"

              mv data.json.tmp data.json

              echo "✅ data.json updated successfully"

              SUCCESS=true

              break

            fi


            # ==========================================
            # Retry
            # ==========================================

            if [ "$attempt" -lt "$MAX_RETRIES" ]; then

              echo ""
              echo "⏳ Valid data not received."

              echo "⏳ Retrying after ${RETRY_DELAY} seconds..."

              sleep "$RETRY_DELAY"

              RETRY_DELAY=$((RETRY_DELAY * 2))

            fi

          done


          # ==========================================
          # সব Retry ব্যর্থ
          # ==========================================

          if [ "$SUCCESS" != "true" ]; then

            echo ""
            echo "=========================================="
            echo "❌ GAS synchronization FAILED"
            echo "=========================================="

            echo "❌ $MAX_RETRIES attempts failed."

            echo "ℹ️ Existing data.json was not replaced."

            echo "ℹ️ GitHub will NOT receive invalid data."

            echo "ℹ️ Firebase deployment will NOT happen."

            rm -f data.json.tmp

            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "✅ Valid GAS data successfully received"
          echo "=========================================="


      # ==========================================
      # ৩. GitHub Commit & Push
      # ==========================================

      - name: Commit and Push
        shell: bash
        run: |

          git config --global user.name \
            "github-actions[bot]"

          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"


          git add data.json


          # ==========================================
          # কোনো পরিবর্তন না থাকলে
          # ==========================================

          if git diff --cached --quiet; then

            echo "ℹ️ data.json has no changes."

            echo "ℹ️ No commit required."

            exit 0

          fi


          echo "📦 New data detected."


          # ==========================================
          # Commit
          # ==========================================

          VERSION="${{ github.event.client_payload.version }}"

          if [ -z "$VERSION" ]; then
            VERSION="unknown"
          fi


          git commit \
            -m "chore: auto-update data.json (v${VERSION})"


          # ==========================================
          # Push
          # ==========================================

          git push


          echo "=========================================="

          echo "✅ data.json successfully pushed to GitHub."

          echo "=========================================="


      # ==========================================
      # ৪. Firebase Deploy
      # ==========================================

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0

        with:

          repoToken: '${{ secrets.GITHUB_TOKEN }}'

          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

          channelId: live

          projectId: '${{ secrets.FIREBASE_PROJECT_ID }}'
