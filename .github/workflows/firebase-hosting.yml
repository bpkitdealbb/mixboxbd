name: Deploy to Firebase Hosting on Push
on:
  push:
    branches: [ main ]
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ==========================================
      # ✅ নতুন যোগ করা হয়েছে: স্বয়ংক্রিয়ালি Sitemap তৈরি
      # ==========================================
      - name: Generate Sitemap from Google Sheets
        run: |
          echo "📥 Sitemap ডাউনলোড হচ্ছে..."
          curl -s "https://script.google.com/macros/s/AKfycbzVVnqM8BRootcSD5xsDrcsFOSMTfWb3KAzlIWHfEXNFdE-NYOzCX8EbyGUGslbQyVs/exec?page=sitemap" -o public/sitemap.xml
          
          if [ -f "public/sitemap.xml" ]; then
            echo "✅ সফলভাবে Sitemap তৈরি হয়েছে!"
            echo "মোট লিংক: $(grep -c '<loc>' public/sitemap.xml)"
          else
            echo "❌ Sitemap তৈরি হয়নি। কিছু এরর হয়েছে।"
          fi

      - name: Deploy to Firebase Hosting on Push
        uses: FirebaseActions/action@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: safaboxbd
          channelId: ${{ secrets.FIREBASE_CHANNEL_ID }}
